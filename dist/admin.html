<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b141a"><title>Админ · EASY CAR WASH</title><link rel="stylesheet" href="admin.css"></head><body><header><a href="index.html" class="brand">EASY <span>CAR WASH</span></a><div class="head-actions"><button id="notify" hidden>Мэдэгдэл асаах</button><button id="logout" hidden>Гарах</button></div></header><main><section id="login-panel" class="login-card"><span class="eyebrow">АДМИН ХЭСЭГ</span><h1>Тавтай морил</h1><p>Зөвхөн эрхтэй ажилтан нэвтэрнэ.</p><form id="login-form"><label>Имэйл<input name="email" type="email" autocomplete="username" required></label><label>Нууц үг<input name="password" type="password" autocomplete="current-password" required></label><button>Нэвтрэх ↗</button><p id="login-message" role="status"></p></form></section><section id="dashboard" hidden><div class="topline"><div><span class="eyebrow">ЗАХИАЛГЫН ХЯНАЛТ</span><h1>Өнөөдрийн ажил</h1><p>Шинэ захиалгыг баталгаажуулж, үнийн саналаа илгээнэ.</p></div><label>Өдөр<input type="date" id="day"></label></div><div id="stats" class="stats"></div><div class="toolbar"><div class="tabs"><button data-filter="active" class="active">Идэвхтэй</button><button data-filter="all">Бүгд</button><button data-filter="done">Хийгдсэн</button><button data-filter="cancelled">Цуцлагдсан</button></div><button id="refresh">Шинэчлэх ↻</button></div><p id="dashboard-message" role="status"></p><div id="orders" class="orders"></div><section class="posts-manager"><div class="topline"><div><span class="eyebrow">ҮНДСЭН САЙТЫН НИЙТЛЭЛ</span><h2>Зураг, мэдээлэл нэмэх</h2><p>Бодит ажлын зураг, тайлбараа сайт дээр нийтлээрэй.</p></div><button id="posts-refresh" type="button">Жагсаалт шинэчлэх</button></div><form id="post-form"><fieldset><label>Зураг (JPG, PNG, WebP · 5 MB хүртэл)<input type="file" name="image" accept="image/jpeg,image/png,image/webp" required></label><img id="post-preview" alt="Сонгосон зургийн урьдчилан харах" hidden><label>Тайлбар<textarea name="caption" maxlength="2000" required placeholder="Ямар машин, ямар үйлчилгээ хийсэн бэ?"></textarea></label><div class="post-actions"><button type="submit" class="primary">Нийтлэх</button><button type="button" id="post-cancel">Шинээр эхлэх</button></div></fieldset></form><p id="post-message" role="status"></p><div id="admin-posts"></div></section></section></main><dialog id="detail"><div class="detail-top"><h2>Захиалгын дэлгэрэнгүй</h2><button id="close-detail" aria-label="Хаах">✕</button></div><div id="detail-body"></div></dialog><script src="config.js"></script><script type="module" src="admin.js"></script></body></html>
