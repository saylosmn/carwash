<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b141a"><title>Миний захиалгууд · EASY CAR WASH</title><link rel="stylesheet" href="admin.css"><style>main{max-width:760px}h1{font-size:clamp(32px,5vw,54px);letter-spacing:-2px}.saved-list{display:grid;gap:12px;margin-top:26px}.saved-order{display:block;padding:20px;border:1px solid #ffffff28;border-radius:14px;background:#18272e;text-decoration:none;color:#e9f1f2}.saved-order strong{display:block;font-size:17px}.saved-order span{display:block;margin-top:8px;color:#a9bfc2}.notice{color:#a9bfc2;line-height:1.7}</style></head><body><header><a href="index.html" class="brand">EASY <span>CAR WASH</span></a><a href="index.html" style="color:#b7e4e7">Нүүр хуудас ↗</a></header><main><span class="eyebrow">EASY CAR WASH</span><h1>Миний захиалгууд</h1><p class="notice">Энэ төхөөрөмжид хадгалсан захиалгын холбоосууд. Өөр төхөөрөмж дээр харахын тулд тухайн захиалгын холбоосыг хуулж хадгалаарай.</p><div class="saved-list" id="saved-list"></div></main><script src="saved-orders.js"></script><script>const root=document.querySelector('#saved-list');const rows=window.EASY_SAVED_ORDERS.read();if(!rows.length){const p=document.createElement('p');p.className='notice';p.textContent='Энэ төхөөрөмжид хадгалсан захиалга алга.';root.append(p)}for(const row of rows){const a=document.createElement('a');a.className='saved-order';const url=new URL('order.html',location.href);url.searchParams.set('token',row.token);a.href=url.href;const title=document.createElement('strong');title.textContent=row.vehicle||'Захиалга';const info=document.createElement('span');info.textContent=[row.date,row.hour!=null?`${String(row.hour).padStart(2,'0')}:00`:null].filter(Boolean).join(' · ');a.append(title,info);root.append(a)}</script></body></html>
